<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0e1014" />
    <title>Gil's Grocery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // pick the saved theme before first paint, so the page never flashes the wrong colors
      try { var t = localStorage.getItem("proto-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <style>
      /* ── Design tokens: every color, radius and motion curve in the app comes from here ── */
      :root {
        --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --ease: cubic-bezier(.2, .8, .2, 1);
        --ease-out: cubic-bezier(.16, 1, .3, 1);
        --r-sm: 8px; --r: 12px; --r-lg: 16px; --r-xl: 22px;

        --bg: #f5f5f1;
        --surface: #ffffff;
        --surface-2: #f0f0eb;
        --surface-3: #e7e7e1;
        --border: #e4e4de;
        --border-strong: #d0d0c8;
        --text: #1c1d20;
        --muted: #686c73;
        --faint: #9b9fa6;
        --brand: #a86f00;
        --brand-ink: #ffffff;
        --brand-soft: rgba(168, 111, 0, .10);
        --danger: #cf3d3d;
        --danger-soft: rgba(207, 61, 61, .09);
        --success: #23874d;
        --success-soft: rgba(35, 135, 77, .10);
        --info: #4f56d6;
        --info-soft: rgba(79, 86, 214, .10);
        --shadow: 0 1px 2px rgba(25, 25, 15, .04), 0 3px 12px rgba(25, 25, 15, .05);
        --shadow-lg: 0 18px 50px rgba(25, 25, 15, .18);
        --overlay: rgba(20, 20, 15, .32);
        --glass: rgba(255, 255, 255, .82);
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --bg: #0e1014;
        --surface: #161920;
        --surface-2: #1c2028;
        --surface-3: #242934;
        --border: #242933;
        --border-strong: #333a46;
        --text: #e8eaee;
        --muted: #99a0ab;
        --faint: #687079;
        --brand: #f2c14e;
        --brand-ink: #1a1505;
        --brand-soft: rgba(242, 193, 78, .13);
        --danger: #f07373;
        --danger-soft: rgba(240, 115, 115, .12);
        --success: #5cc98a;
        --success-soft: rgba(92, 201, 138, .12);
        --info: #8b91ff;
        --info-soft: rgba(139, 145, 255, .13);
        --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 4px 16px rgba(0, 0, 0, .22);
        --shadow-lg: 0 18px 50px rgba(0, 0, 0, .55);
        --overlay: rgba(0, 0, 0, .55);
        --glass: rgba(22, 25, 32, .82);
        color-scheme: dark;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html { background: var(--bg); }
      body {
        background: var(--bg); color: var(--text); font-family: var(--font);
        -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        font-feature-settings: "cv11", "ss01"; transition: background-color .3s var(--ease);
      }
      button, input, select, textarea { font-family: inherit; }
      input, select, textarea { min-width: 0; max-width: 100%; }
      :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      ::selection { background: var(--brand-soft); }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
